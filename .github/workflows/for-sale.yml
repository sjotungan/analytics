name: For sale on Myggdalsvägen

# Hemnet blocks many GitHub runner IPs (HTTP 403), so a single daily run
# fails more often than not. Instead, try every 2 hours (each run gets a new
# runner/IP) until one succeeds; the day's list is saved as an artifact named
# for-sale-YYYY-MM-DD and later attempts that day are skipped. A blocked
# attempt does not fail the run; the run fails only when no list has been
# fetched for more than 26 hours, so you get at most about one email a day.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Skip if today's list is already fetched
        id: check
        run: |
          today=$(TZ=Europe/Stockholm date +%F)
          echo "today=$today" >> "$GITHUB_OUTPUT"
          n=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=for-sale-$today" -q '.total_count')
          if [ "$n" -gt 0 ] && [ "${{ github.event_name }}" = schedule ]; then
            echo "Already fetched today; skipping."
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.done != 'true'
      - uses: actions/setup-python@v5
        if: steps.check.outputs.done != 'true'
        with:
          python-version: "3.12"
      - run: pip install curl_cffi
        if: steps.check.outputs.done != 'true'

      # Booli serves a Cloudflare challenge to GitHub runners; Hemnet only (run Booli locally)
      - name: Fetch listings
        id: fetch
        if: steps.check.outputs.done != 'true'
        continue-on-error: true
        run: python scripts/fetch_for_sale.py --sources hemnet --out for_sale.md

      - run: cat for_sale.md >> "$GITHUB_STEP_SUMMARY"
        if: steps.check.outputs.done != 'true' && hashFiles('for_sale.md') != ''

      - uses: actions/upload-artifact@v4
        if: steps.fetch.outcome == 'success'
        with:
          name: for-sale-${{ steps.check.outputs.today }}
          path: for_sale.md
          retention-days: 90
          overwrite: true

      - name: Fail only if no list for over 26 hours
        if: steps.fetch.outcome == 'failure'
        run: |
          last=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            -q '[.artifacts[] | select(.name | startswith("for-sale-"))][0].created_at // empty')
          echo "Blocked this time; last successful fetch: ${last:-never}"
          if [ -z "$last" ] || [ $(( $(date +%s) - $(date -d "$last" +%s) )) -gt $((26 * 3600)) ]; then
            echo "::error::No for-sale list fetched in over 26 hours"
            exit 1
          fi
          echo "::warning::Hemnet blocked this attempt; will retry in ~2 hours"
